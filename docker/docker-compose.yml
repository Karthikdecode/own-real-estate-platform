# Local PostgreSQL for development.
# Run from the repository root:  pnpm db:up   (uses --env-file .env)
# Credentials come from the root .env (see .env.example) - nothing secret is stored here.
name: real-estate-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: real-estate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME must be set in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
    ports:
      # Bound to loopback only so the database is not exposed to the local network.
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
